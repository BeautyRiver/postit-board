# Firebase CLI(firebase init hosting:github)가 생성한 파일을 이 프로젝트에 맞게 수정
# main에 푸시하면: 빌드 → 보안 규칙 테스트 → 사이트 배포(Hosting) → 보안 규칙 게시(Firestore)
# 규칙 테스트가 실패하면 아무것도 배포하지 않는다

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # GitHub Actions 탭에서 수동 재배포용

# 연달아 푸시하면 이전 배포는 취소하고 마지막 것만 배포
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

env:
  FIREBASE_TOOLS: firebase-tools@15.34.2
  PROJECT_ID: postit-board-74a67

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Firestore 에뮬레이터(규칙 테스트)에 필요
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # .env.local은 git에 없으므로 GitHub Secret(ENV_LOCAL)에 넣어 둔 내용으로 만든다
      - name: Create .env.local from secret
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
        run: |
          if [ -z "$ENV_LOCAL" ]; then
            echo "::error::GitHub Secret 'ENV_LOCAL'이 없습니다. Settings → Secrets and variables → Actions에서 .env.local 내용을 등록하세요."
            exit 1
          fi
          printf '%s\n' "$ENV_LOCAL" > .env.local
      - run: npm ci
      - run: npm run build

      - name: Test Firestore rules (emulator)
        run: npx -y "$FIREBASE_TOOLS" emulators:exec --only firestore --project demo-postit-rules "node --test tests/firestore.rules.test.mjs"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POSTIT_BOARD_74A67 }}
          channelId: live
          projectId: postit-board-74a67

      # 보안 규칙(firestore.rules) 게시 — 콘솔에 붙여넣을 필요 없음
      # 서비스 계정에 'Firebase Rules Admin' + 'Service Usage Consumer' 역할이 필요 (docs/firebase-setup.md 4-1)
      - name: Deploy Firestore rules
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POSTIT_BOARD_74A67 }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "배포 서비스 계정: $(jq -r .client_email "$RUNNER_TEMP/sa.json")"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx -y "$FIREBASE_TOOLS" deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive \
            || { echo "::error::보안 규칙 게시 실패 — 서비스 계정 권한(Firebase Rules Admin, Service Usage Consumer)을 확인하세요. docs/firebase-setup.md 4-1"; rm -f "$RUNNER_TEMP/sa.json"; exit 1; }
          rm -f "$RUNNER_TEMP/sa.json"
